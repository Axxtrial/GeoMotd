name: Build & Package GeoMOTD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multiplatform JARs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Verify Build Artifacts
        run: |
          ls -lh geomotd-paper/target/*.jar
          ls -lh geomotd-velocity/target/*.jar
          ls -lh geomotd-bungee/target/*.jar

      - name: Upload Build Artifacts (Actions Download)
        uses: actions/upload-artifact@v4
        with:
          name: GeoMOTD-All-Platforms
          path: |
            geomotd-paper/target/GeoMOTD-Paper-*.jar
            geomotd-velocity/target/GeoMOTD-Velocity-*.jar
            geomotd-bungee/target/GeoMOTD-Bungee-*.jar
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: GeoMOTD ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            geomotd-paper/target/GeoMOTD-Paper-*.jar
            geomotd-velocity/target/GeoMOTD-Velocity-*.jar
            geomotd-bungee/target/GeoMOTD-Bungee-*.jar
