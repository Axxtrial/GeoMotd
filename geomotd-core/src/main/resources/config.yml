# ========================================================
#                    GeoMOTD Configuration
#             Developed for axspace.us/geomotd
# ========================================================

# Fallback language used when a player's country is not recognized
# or if no specific MOTD is defined for their language.
default-language: "en"

# Language used for localhost / LAN / private IPs (127.0.0.1, 192.168.x.x, etc.)
local-language: "en"

# Asynchronously check GitHub Releases for new plugin updates
check-updates: true

# Enable anonymous metrics collection via bStats (ID: 35172)
# Helps the author track plugin adoption and popular default languages.
metrics: true

# Server Icons (Favicons) Settings
# Minecraft requires 64x64 PNG images.
# Place your icons in the 'icons/' folder inside the GeoMOTD plugin directory.
icons:
  # Enable dynamic server icon switching
  enabled: true
  # Fallback default icon if no specific language icon matches
  default: "icons/default.png"
  # Default icons by language code (en, es, pt, etc.)
  languages:
    en: "icons/icon_en.png"
    es: "icons/icon_es.png"
    pt: "icons/icon_pt.png"

# Database Configuration
database:
  # The database file name in the plugin folder
  file: "GeoLite2-Country.mmdb"
  # URL used to download the GeoLite2 database on the first run if missing
  download-url: "https://raw.githubusercontent.com/P3TERX/GeoLite.mmdb/download/GeoLite2-Country.mmdb"
  # Whether to download the database automatically on startup if missing
  auto-download: true

# Countries & Slugs Configuration
countries:
  # The file containing country ISO-2 to language mapping (e.g. MX -> es, US -> en)
  file: "countries.json"
  # Whether to automatically check/update the countries list from the remote repository
  auto-update: false
  # URL to download/update the countries.json mapping
  update-url: "https://raw.githubusercontent.com/axspace/GeoMOTD-data/main/countries.json"

# In-Memory Cache settings (powered by Caffeine Cache for sub-millisecond pings)
cache:
  # Maximum number of IP addresses to keep in RAM cache
  max-entries: 50000
  # Time in minutes before an IP location cache expires (24 hours = 1440 min)
  expire-minutes: 1440

# ========================================================
#                    MOTD Definitions
# ========================================================
# Minecraft multiplayer server lists display exactly 2 lines (line1 & line2).
# Supports full MiniMessage tags: <gradient:#hex:#hex>, <rainbow>, <bold>, <color:#hex>, <reset>
#
# RANDOM ROTATION (Optional):
# You can define multiple MOTDs per language using '-' list items.
# Every time a player refreshes their server list, one will be chosen at random.
# If you only want a single permanent MOTD, simply leave 1 MOTD (as shown in the 'pt' section below).
#
# CUSTOM ICON OVERRIDE (Optional):
# By default, the icon defined in 'icons.languages' above is used automatically.
# However, you can optionally add 'icon: "icons/custom.png"' to any MOTD entry
# if you want that specific MOTD (e.g. for maintenance or events) to display a different icon.
motds:
  en:
    # --- MOTD 1 (Default) ---
    - line1: "<gradient:#00FFAA:#00AAFF><bold>Minecraft Server</bold></gradient> <dark_gray>●</dark_gray> <gray>1.21 - 1.26</gray>"
      line2: "<yellow>Welcome to our multiplayer community!</yellow>"

    # --- MOTD 2 (Optional - Cycles randomly on player refresh) ---
    - line1: "<gradient:#FFAA00:#FF5555><bold>Survival & Adventure</bold></gradient> <dark_gray>●</dark_gray> <green>Online</green>"
      line2: "<white>Explore, build, and survive with friends!</white>"

  es:
    # --- MOTD 1 (Predeterminado) ---
    - line1: "<gradient:#00FFAA:#00AAFF><bold>Servidor de Minecraft</bold></gradient> <dark_gray>●</dark_gray> <gray>1.21 - 1.26</gray>"
      line2: "<yellow>¡Bienvenido a nuestra comunidad multijugador!</yellow>"

    # --- MOTD 2 (Opcional - Rota aleatoriamente al refrescar lista) ---
    - line1: "<gradient:#FFAA00:#FF5555><bold>Supervivencia y Aventura</bold></gradient> <dark_gray>●</dark_gray> <green>En línea</green>"
      line2: "<white>¡Explora, construye y sobrevive con amigos!</white>"

  pt:
    # --- MOTD 1 Único (Fijo, sin rotación) ---
    - line1: "<gradient:#00FFAA:#00AAFF><bold>Servidor de Minecraft</bold></gradient> <dark_gray>●</dark_gray> <gray>1.21 - 1.26</gray>"
      line2: "<yellow>Bem-vindo à nossa comunidade multijugador!</yellow>"
