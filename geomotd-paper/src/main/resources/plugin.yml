name: GeoMOTD
version: 1.0.0
main: us.axspace.geomotd.paper.GeoMOTDPaper
api-version: '1.20'
author: axxtrial
description: Ultra-fast GeoIP-based Multi-Language MOTD for Paper and Folia
folia-supported: true

commands:
  geomotd:
    description: GeoMOTD administrative command
    permission: geomotd.admin
    usage: /geomotd [reload|status]

permissions:
  geomotd.admin:
    description: Permission to manage GeoMOTD
    default: op
